{
  "name": "MCP source tests",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "test": {
      "name": "Node ${{ matrix.node }} stdio regression",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "20",
            "22",
            "24"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "${{ matrix.node }}"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "name": "Check dependency advisories",
          "run": "npm audit --audit-level=low"
        },
        {
          "run": "npm test"
        }
      ]
    },
    "package": {
      "name": "Build GitHub preview package",
      "needs": "test",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "20"
          }
        },
        {
          "run": "npm ci\nnpm run build\nmkdir release-package\nnpm pack --pack-destination release-package --json > release-package/pack.json\nsha256sum release-package/*.tgz > release-package/SHA256SUMS\nnpm audit --json > release-package/audit.json"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "mcp-preview-package",
            "path": "release-package/"
          }
        }
      ]
    },
    "installed": {
      "name": "Packed npm executable / Node ${{ matrix.node }}",
      "needs": "package",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "20",
            "22",
            "24"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "${{ matrix.node }}"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "mcp-preview-package",
            "path": "release-package"
          }
        },
        {
          "run": "sha256sum --check release-package/SHA256SUMS\nnpm ci\nmkdir -p \"$RUNNER_TEMP/mcp-consumer\"\ncd \"$RUNNER_TEMP/mcp-consumer\"\nnpm init -y\nnpm install --ignore-scripts \"$MCP_SERVER_PACKAGE\"\nnpm audit --json > audit.json\nnode --test --test-concurrency=1 \"$GITHUB_WORKSPACE\"/test/*.test.mjs",
          "env": {
            "MCP_SERVER_PACKAGE": "${{ github.workspace }}/release-package/originchain-mcp-server-0.2.0-rc.1.tgz"
          },
          "name": "Verify packed executable without concurrent cold npx cache installs"
        },
        {
          "name": "Verify all README tools and resource against packed archive",
          "if": "matrix.node == '20'",
          "run": "cd \"$RUNNER_TEMP/mcp-consumer\"\nnode \"$GITHUB_WORKSPACE/test/readme-fixture.mjs\" packed \"$GITHUB_WORKSPACE/README.md\" \"$GITHUB_WORKSPACE/release-package/originchain-mcp-server-0.2.0-rc.1.tgz\" \"$GITHUB_WORKSPACE/readme-verification.json\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "mcp-installed-node${{ matrix.node }}",
            "path": "${{ runner.temp }}/mcp-consumer/audit.json\n${{ runner.temp }}/mcp-consumer/package-lock.json"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "matrix.node == '20'",
          "with": {
            "name": "mcp-all-tools-fixture",
            "path": "readme-verification.json"
          }
        }
      ]
    },
    "promotion-verification": {
      "name": "Verify existing GitHub preview promotion",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24"
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "run": "python -m unittest discover -s scripts -p 'test_*.py' -v"
        },
        {
          "name": "Select existing archive without npm publication",
          "env": {
            "RELEASE_VERSION": "0.2.0-rc.1",
            "PREVIEW_VERIFY_ONLY": "1",
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python scripts/release_preview.py prepare release-dist"
        },
        {
          "name": "Exercise shared promotion pipeline against the immutable tag",
          "run": "python scripts/checkout_preview.py release-dist release-source\nbash scripts/check_preview.sh release-dist release-source 24"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "mcp-promotion-verification",
            "path": "release-dist/",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
