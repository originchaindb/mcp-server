{
  "name": "MCP source tests",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "test": {
      "name": "Node ${{ matrix.node }} stdio regression",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "20",
            "22",
            "24"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "${{ matrix.node }}"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "name": "Check dependency advisories",
          "run": "npm audit --audit-level=low"
        },
        {
          "run": "npm test"
        }
      ]
    },
    "package": {
      "name": "Build GitHub preview package",
      "needs": "test",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "20"
          }
        },
        {
          "run": "npm ci\nnpm run build\nmkdir release-package\nnpm pack --pack-destination release-package --json > release-package/pack.json\nsha256sum release-package/*.tgz > release-package/SHA256SUMS\nnpm audit --json > release-package/audit.json"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "mcp-preview-package",
            "path": "release-package/"
          }
        }
      ]
    },
    "installed": {
      "name": "Packed npm executable / Node ${{ matrix.node }}",
      "needs": "package",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "20",
            "22",
            "24"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "${{ matrix.node }}"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "mcp-preview-package",
            "path": "release-package"
          }
        },
        {
          "run": "sha256sum --check release-package/SHA256SUMS\nnpm ci\nmkdir -p \"$RUNNER_TEMP/mcp-consumer\"\ncd \"$RUNNER_TEMP/mcp-consumer\"\nnpm init -y\nnpm install --ignore-scripts \"$MCP_SERVER_PACKAGE\"\nnpm audit --json > audit.json\nnode --test \"$GITHUB_WORKSPACE\"/test/*.test.mjs",
          "env": {
            "MCP_SERVER_PACKAGE": "${{ github.workspace }}/release-package/originchain-mcp-server-0.1.3-rc.1.tgz"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "mcp-installed-node${{ matrix.node }}",
            "path": "${{ runner.temp }}/mcp-consumer/audit.json\n${{ runner.temp }}/mcp-consumer/package-lock.json"
          }
        }
      ]
    }
  }
}
