name: Promote verified MCP preview to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing verified GitHub preview, X.Y.Z-rc.N
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mcp-npm-release
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.preview.outputs.version }}
      head: ${{ steps.preview.outputs.head }}
      archive: ${{ steps.preview.outputs.archive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: preview
        name: Bind the existing release archive to its tag and current package source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_preview.py prepare release-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-registry-candidate
          path: release-dist/
          if-no-files-found: error

  acceptance:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.select.outputs.head }}
          path: release-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mcp-registry-candidate
          path: release-dist
      - name: Verify and exercise the exact archive using the PR-tested promotion pipeline
        run: bash scripts/check_preview.sh release-dist release-source '${{ matrix.node }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-registry-acceptance-node${{ matrix.node }}
          path: release-dist/*-node${{ matrix.node }}.*
          if-no-files-found: error

  publish:
    needs: [select, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mcp-registry-candidate
          path: release-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mcp-registry-acceptance-node*
          path: release-dist
          merge-multiple: true
      - name: Publish the exact tested preview with OIDC and the next tag
        run: python scripts/publish_npm.py release-dist
      - name: Verify the fresh public-registry executable and all five tools
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          npm ci
          mkdir "$RUNNER_TEMP/mcp-registry-consumer"
          cd "$RUNNER_TEMP/mcp-registry-consumer"
          npm init -y
          npm install "@originchain/mcp-server@$RELEASE_VERSION" --ignore-scripts --registry=https://registry.npmjs.org
          npm audit --json > "$GITHUB_WORKSPACE/release-dist/registry-audit.json"
          MCP_SERVER_ENTRY="$RUNNER_TEMP/mcp-registry-consumer/node_modules/@originchain/mcp-server/dist/index.js" node "$GITHUB_WORKSPACE/test/readme-fixture.mjs" packed "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/release-dist/${{ needs.select.outputs.archive }}" "$GITHUB_WORKSPACE/release-dist/registry-executable.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-npm-publication
          path: release-dist/
          if-no-files-found: error
